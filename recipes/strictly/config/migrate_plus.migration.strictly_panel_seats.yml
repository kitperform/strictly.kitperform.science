langcode: en
status: true
dependencies: {}
id: strictly_panel_seats
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
- strictly
migration_group: strictly
label: Panel seats
source:
  plugin: csv
  path: /var/www/html/data/package/panel_seats.csv
  ids:
  - panel_seat_key
  track_changes: true
  constants:
    uid: 1
    status: 1
process:
  title:
  - plugin: concat
    source:
    - episode_key
    - judge_slug
    - panel_role
    delimiter: ' · '
  - plugin: substr
    start: 0
    length: 250
  uid: constants/uid
  status: constants/status
  field_key: panel_seat_key
  field_episode:
  - plugin: skip_on_empty
    method: process
    source: episode_key
  - plugin: migration_lookup
    migration: strictly_episodes
    no_stub: true
  field_week:
  - plugin: skip_on_empty
    method: process
    source: week_key
  - plugin: migration_lookup
    migration: strictly_weeks
    no_stub: true
  field_series:
  - plugin: skip_on_empty
    method: process
    source: series_key
  - plugin: migration_lookup
    migration: strictly_series
    no_stub: true
  field_judge:
  - plugin: skip_on_empty
    method: process
    source: judge_slug
  - plugin: migration_lookup
    migration: strictly_people
    no_stub: true
  field_seat_position:
  - plugin: skip_on_empty
    method: process
    source: seat_position
  field_panel_role:
  - plugin: skip_on_empty
    method: process
    source: panel_role
  - plugin: migration_lookup
    migration: strictly_term_panel_role
    no_stub: true
  field_is_head_judge:
  - plugin: skip_on_empty
    method: process
    source: is_head_judge
  - plugin: static_map
    map:
      'true': 1
      'false': 0
  field_is_scoring:
  - plugin: skip_on_empty
    method: process
    source: is_scoring
  - plugin: static_map
    map:
      'true': 1
      'false': 0
  field_replaces:
  - plugin: skip_on_empty
    method: process
    source: replaces_slug
  - plugin: migration_lookup
    migration: strictly_people
    no_stub: true
  field_absence_reason:
  - plugin: skip_on_empty
    method: process
    source: absence_reason
  - plugin: migration_lookup
    migration: strictly_term_absence_reason
    no_stub: true
  field_vote_label: vote_label
  field_source_capture:
  - plugin: skip_on_empty
    method: process
    source: source_capture_key
  - plugin: migration_lookup
    migration: strictly_source_captures
    no_stub: true
  field_source_locator: source_locator
  field_source_kind:
  - plugin: skip_on_empty
    method: process
    source: source_kind
  field_note: note
destination:
  plugin: entity:node
  default_bundle: panel_seat
migration_dependencies:
  required:
  - strictly_episodes
  - strictly_people
  - strictly_series
  - strictly_source_captures
  - strictly_term_absence_reason
  - strictly_term_panel_role
  - strictly_weeks
  optional: []
