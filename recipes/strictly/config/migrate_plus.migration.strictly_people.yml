langcode: en
status: true
dependencies: {}
id: strictly_people
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
- strictly
migration_group: strictly
label: Persons
source:
  plugin: csv
  path: /var/www/html/data/package/people.csv
  ids:
  - person_key
  track_changes: true
  constants:
    uid: 1
    status: 1
process:
  title:
  - plugin: concat
    source:
    - canonical_name
    delimiter: ' · '
  - plugin: substr
    start: 0
    length: 250
  uid: constants/uid
  status: constants/status
  field_key: person_key
  field_slug: slug
  field_person_kind:
  - plugin: skip_on_empty
    method: process
    source: person_kind
  field_identity_basis:
  - plugin: skip_on_empty
    method: process
    source: identity_basis
  field_wiki_title: wiki_title
  field_canonical_name: canonical_name
  field_given_name: given_name
  field_family_name: family_name
  field_gender: gender
  field_source_capture:
  - plugin: skip_on_empty
    method: process
    source: source_capture_key
  - plugin: migration_lookup
    migration: strictly_source_captures
    no_stub: true
  field_source_locator: source_locator
  field_source_kind:
  - plugin: skip_on_empty
    method: process
    source: source_kind
  field_note: note
destination:
  plugin: entity:node
  default_bundle: person
migration_dependencies:
  required:
  - strictly_source_captures
  optional: []
