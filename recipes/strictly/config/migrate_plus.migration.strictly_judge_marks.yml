langcode: en
status: true
dependencies: {}
id: strictly_judge_marks
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
- strictly
migration_group: strictly
label: Judge marks
source:
  plugin: csv
  path: /var/www/html/data/package/judge_marks.csv
  ids:
  - judge_mark_key
  track_changes: true
  constants:
    uid: 1
    status: 1
process:
  title:
  - plugin: concat
    source:
    - week_key
    - chart_label
    - dance_key
    - judge_name
    - mark
    delimiter: ' · '
  - plugin: substr
    start: 0
    length: 250
  uid: constants/uid
  status: constants/status
  field_key: judge_mark_key
  field_performance:
  - plugin: skip_on_empty
    method: process
    source: performance_key
  - plugin: migration_lookup
    migration: strictly_performances
    no_stub: true
  field_panel_seat:
  - plugin: skip_on_empty
    method: process
    source: panel_seat_key
  - plugin: migration_lookup
    migration: strictly_panel_seats
    no_stub: true
  field_judge:
  - plugin: skip_on_empty
    method: process
    source: judge_slug
  - plugin: migration_lookup
    migration: strictly_people
    no_stub: true
  field_d_judge_slug: judge_slug
  field_judge_name: judge_name
  field_seat_position:
  - plugin: skip_on_empty
    method: process
    source: seat_position
  field_panel_role:
  - plugin: skip_on_empty
    method: process
    source: panel_role
  - plugin: migration_lookup
    migration: strictly_term_panel_role
    no_stub: true
  field_is_head_judge:
  - plugin: skip_on_empty
    method: process
    source: is_head_judge
  - plugin: static_map
    map:
      'true': 1
      'false': 0
  field_mark:
  - plugin: skip_on_empty
    method: process
    source: mark
  field_episode:
  - plugin: skip_on_empty
    method: process
    source: episode_key
  - plugin: migration_lookup
    migration: strictly_episodes
    no_stub: true
  field_week:
  - plugin: skip_on_empty
    method: process
    source: week_key
  - plugin: migration_lookup
    migration: strictly_weeks
    no_stub: true
  field_series:
  - plugin: skip_on_empty
    method: process
    source: series_key
  - plugin: migration_lookup
    migration: strictly_series
    no_stub: true
  field_series_number:
  - plugin: skip_on_empty
    method: process
    source: series_number
  field_week_number:
  - plugin: skip_on_empty
    method: process
    source: week_number
  field_round_stage:
  - plugin: skip_on_empty
    method: process
    source: round_stage
  field_air_date:
  - plugin: skip_on_empty
    method: process
    source: air_date
  field_sequence_in_week:
  - plugin: skip_on_empty
    method: process
    source: sequence_in_week
  field_running_order:
  - plugin: skip_on_empty
    method: process
    source: running_order
  field_sequence_in_episode:
  - plugin: skip_on_empty
    method: process
    source: sequence_in_episode
  field_d_perf_seq:
  - plugin: skip_on_empty
    method: process
    source: d_perf_seq
  field_couple:
  - plugin: skip_on_empty
    method: process
    source: couple_key
  - plugin: migration_lookup
    migration: strictly_couples
    no_stub: true
  field_chart_label: chart_label
  field_performing_pro:
  - plugin: skip_on_empty
    method: process
    source: performing_pro_slug
  - plugin: migration_lookup
    migration: strictly_people
    no_stub: true
  field_dance:
  - plugin: skip_on_empty
    method: process
    source: dance_key
  - plugin: migration_lookup
    migration: strictly_term_dance
    no_stub: true
  field_performance_kind:
  - plugin: skip_on_empty
    method: process
    source: performance_kind
  - plugin: migration_lookup
    migration: strictly_term_performance_kind
    no_stub: true
  field_scoring_mode:
  - plugin: skip_on_empty
    method: process
    source: scoring_mode
  field_d_scale_max:
  - plugin: skip_on_empty
    method: process
    source: d_scale_max
  field_source_capture:
  - plugin: skip_on_empty
    method: process
    source: source_capture_key
  - plugin: migration_lookup
    migration: strictly_source_captures
    no_stub: true
  field_source_locator: source_locator
  field_source_kind:
  - plugin: skip_on_empty
    method: process
    source: source_kind
  field_note: note
destination:
  plugin: entity:node
  default_bundle: judge_mark
migration_dependencies:
  required:
  - strictly_couples
  - strictly_episodes
  - strictly_panel_seats
  - strictly_people
  - strictly_performances
  - strictly_series
  - strictly_source_captures
  - strictly_term_dance
  - strictly_term_panel_role
  - strictly_term_performance_kind
  - strictly_weeks
  optional: []
