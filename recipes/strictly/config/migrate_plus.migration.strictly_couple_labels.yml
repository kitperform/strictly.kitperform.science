langcode: en
status: true
dependencies: {}
id: strictly_couple_labels
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
- strictly
migration_group: strictly
label: Couple labels
source:
  plugin: csv
  path: /var/www/html/data/package/couple_labels.csv
  ids:
  - couple_label_key
  track_changes: true
  constants:
    uid: 1
    status: 1
process:
  title:
  - plugin: concat
    source:
    - couple_key
    - label
    - context
    delimiter: ' · '
  - plugin: substr
    start: 0
    length: 250
  uid: constants/uid
  status: constants/status
  field_key: couple_label_key
  field_couple:
  - plugin: skip_on_empty
    method: process
    source: couple_key
  - plugin: migration_lookup
    migration: strictly_couples
    no_stub: true
  field_label: label
  field_couple_label_context:
  - plugin: skip_on_empty
    method: process
    source: context
  field_week_from:
  - plugin: skip_on_empty
    method: process
    source: week_from
  field_week_to:
  - plugin: skip_on_empty
    method: process
    source: week_to
  field_is_typo:
  - plugin: skip_on_empty
    method: process
    source: is_typo
  - plugin: static_map
    map:
      'true': 1
      'false': 0
  field_source_capture:
  - plugin: skip_on_empty
    method: process
    source: source_capture_key
  - plugin: migration_lookup
    migration: strictly_source_captures
    no_stub: true
  field_source_locator: source_locator
  field_source_kind:
  - plugin: skip_on_empty
    method: process
    source: source_kind
  field_note: note
destination:
  plugin: entity:node
  default_bundle: couple_label
migration_dependencies:
  required:
  - strictly_couples
  - strictly_source_captures
  optional: []
