langcode: en
status: true
dependencies: {}
id: strictly_results_rounds
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
- strictly
migration_group: strictly
label: Results rounds
source:
  plugin: csv
  path: /var/www/html/data/package/results_rounds.csv
  ids:
  - round_key
  track_changes: true
  constants:
    uid: 1
    status: 1
process:
  title:
  - plugin: concat
    source:
    - round_key
    - label
    delimiter: ' · '
  - plugin: substr
    start: 0
    length: 250
  uid: constants/uid
  status: constants/status
  field_key: round_key
  field_series:
  - plugin: skip_on_empty
    method: process
    source: series_key
  - plugin: migration_lookup
    migration: strictly_series
    no_stub: true
  field_round_kind:
  - plugin: skip_on_empty
    method: process
    source: round_kind
  field_label: label
  field_deciding_week:
  - plugin: skip_on_empty
    method: process
    source: deciding_week_key
  - plugin: migration_lookup
    migration: strictly_weeks
    no_stub: true
  field_decided_at_episode:
  - plugin: skip_on_empty
    method: process
    source: decided_at_episode_key
  - plugin: migration_lookup
    migration: strictly_episodes
    no_stub: true
  field_weeks:
  - plugin: skip_on_empty
    method: process
    source: week_keys
  - plugin: explode
    delimiter: '|'
  - plugin: migration_lookup
    migration: strictly_weeks
    no_stub: true
  field_mechanism_actual:
  - plugin: skip_on_empty
    method: process
    source: elimination_mechanism_actual
  - plugin: migration_lookup
    migration: strictly_term_elimination_mechanism
    no_stub: true
  field_exit_count:
  - plugin: skip_on_empty
    method: process
    source: exit_count
  field_at_risk_size_actual:
  - plugin: skip_on_empty
    method: process
    source: at_risk_group_size_actual
  field_dance_off_status:
  - plugin: skip_on_empty
    method: process
    source: dance_off_status
  - plugin: migration_lookup
    migration: strictly_term_dance_off_status
    no_stub: true
  field_vote_direction:
  - plugin: skip_on_empty
    method: process
    source: vote_direction
  field_casting_vote_judge:
  - plugin: skip_on_empty
    method: process
    source: casting_vote_slug
  - plugin: migration_lookup
    migration: strictly_people
    no_stub: true
  field_casting_vote_src_kind:
  - plugin: skip_on_empty
    method: process
    source: casting_vote_source_kind
  field_casting_vote_used:
  - plugin: skip_on_empty
    method: process
    source: casting_vote_used
  - plugin: static_map
    map:
      'true': 1
      'false': 0
  field_casting_vote_inferred:
  - plugin: skip_on_empty
    method: process
    source: casting_vote_inferred
  - plugin: static_map
    map:
      'true': 1
      'false': 0
  field_votes_recorded:
  - plugin: skip_on_empty
    method: process
    source: votes_recorded
  - plugin: static_map
    map:
      'true': 1
      'false': 0
  field_votes_carried_over:
  - plugin: skip_on_empty
    method: process
    source: votes_carried_over
  - plugin: static_map
    map:
      'true': 1
      'false': 0
  field_combined_reason: combined_reason
  field_d_n_scoring_seats:
  - plugin: skip_on_empty
    method: process
    source: d_n_scoring_seats
  field_source_capture:
  - plugin: skip_on_empty
    method: process
    source: source_capture_key
  - plugin: migration_lookup
    migration: strictly_source_captures
    no_stub: true
  field_source_locator: source_locator
  field_source_kind:
  - plugin: skip_on_empty
    method: process
    source: source_kind
  field_note: note
destination:
  plugin: entity:node
  default_bundle: results_round
migration_dependencies:
  required:
  - strictly_episodes
  - strictly_people
  - strictly_series
  - strictly_source_captures
  - strictly_term_dance_off_status
  - strictly_term_elimination_mechanism
  - strictly_weeks
  optional: []
