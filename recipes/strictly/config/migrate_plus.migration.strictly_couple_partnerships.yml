langcode: en
status: true
dependencies: {}
id: strictly_couple_partnerships
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
- strictly
migration_group: strictly
label: Couple partnerships
source:
  plugin: csv
  path: /var/www/html/data/package/couple_partnerships.csv
  ids:
  - couple_partnership_key
  track_changes: true
  constants:
    uid: 1
    status: 1
process:
  title:
  - plugin: concat
    source:
    - couple_key
    - pro_person_key
    - partnership_kind
    delimiter: ' · '
  - plugin: substr
    start: 0
    length: 250
  uid: constants/uid
  status: constants/status
  field_key: couple_partnership_key
  field_couple:
  - plugin: skip_on_empty
    method: process
    source: couple_key
  - plugin: migration_lookup
    migration: strictly_couples
    no_stub: true
  field_professional:
  - plugin: skip_on_empty
    method: process
    source: pro_person_key
  - plugin: migration_lookup
    migration: strictly_people
    no_stub: true
  field_week_from:
  - plugin: skip_on_empty
    method: process
    source: week_from
  field_week_to:
  - plugin: skip_on_empty
    method: process
    source: week_to
  field_partnership_kind:
  - plugin: skip_on_empty
    method: process
    source: partnership_kind
  field_reason:
  - plugin: skip_on_empty
    method: process
    source: reason
  - plugin: migration_lookup
    migration: strictly_term_absence_reason
    no_stub: true
  field_reason_text: reason_text
  field_source_capture:
  - plugin: skip_on_empty
    method: process
    source: source_capture_key
  - plugin: migration_lookup
    migration: strictly_source_captures
    no_stub: true
  field_source_locator: source_locator
  field_source_kind:
  - plugin: skip_on_empty
    method: process
    source: source_kind
  field_note: note
destination:
  plugin: entity:node
  default_bundle: couple_partnership
migration_dependencies:
  required:
  - strictly_couples
  - strictly_people
  - strictly_source_captures
  - strictly_term_absence_reason
  optional: []
