langcode: en
status: true
dependencies: {}
id: strictly_weeks
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
- strictly
migration_group: strictly
label: Weeks
source:
  plugin: csv
  path: /var/www/html/data/package/weeks.csv
  ids:
  - week_key
  track_changes: true
  constants:
    uid: 1
    status: 1
process:
  title:
  - plugin: concat
    source:
    - series_key
    - heading_raw
    delimiter: ' · '
  - plugin: substr
    start: 0
    length: 250
  uid: constants/uid
  status: constants/status
  field_key: week_key
  field_series:
  - plugin: skip_on_empty
    method: process
    source: series_key
  - plugin: migration_lookup
    migration: strictly_series
    no_stub: true
  field_week_number:
  - plugin: skip_on_empty
    method: process
    source: week_number
  field_round_stage:
  - plugin: skip_on_empty
    method: process
    source: round_stage
  field_theme:
  - plugin: skip_on_empty
    method: process
    source: theme_key
  - plugin: migration_lookup
    migration: strictly_term_theme
    no_stub: true
  field_heading_raw: heading_raw
  field_dance_brief_raw: dance_brief_raw
  field_lifecycle_status:
  - plugin: skip_on_empty
    method: process
    source: lifecycle_status
  field_source_capture:
  - plugin: skip_on_empty
    method: process
    source: source_capture_key
  - plugin: migration_lookup
    migration: strictly_source_captures
    no_stub: true
  field_source_locator: source_locator
  field_source_kind:
  - plugin: skip_on_empty
    method: process
    source: source_kind
  field_note: note
destination:
  plugin: entity:node
  default_bundle: week
migration_dependencies:
  required:
  - strictly_series
  - strictly_source_captures
  - strictly_term_theme
  optional: []
