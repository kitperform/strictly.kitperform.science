langcode: en
status: true
dependencies: {}
id: strictly_format_rules
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
- strictly
migration_group: strictly
label: Format rules
source:
  plugin: csv
  path: /var/www/html/data/package/format_rules.csv
  ids:
  - format_rule_key
  track_changes: true
  constants:
    uid: 1
    status: 1
process:
  title:
  - plugin: concat
    source:
    - format_rule_key
    delimiter: ' · '
  - plugin: substr
    start: 0
    length: 250
  uid: constants/uid
  status: constants/status
  field_key: format_rule_key
  field_series:
  - plugin: skip_on_empty
    method: process
    source: series_key
  - plugin: migration_lookup
    migration: strictly_series
    no_stub: true
  field_week:
  - plugin: skip_on_empty
    method: process
    source: week_key
  - plugin: migration_lookup
    migration: strictly_weeks
    no_stub: true
  field_episode:
  - plugin: skip_on_empty
    method: process
    source: episode_key
  - plugin: migration_lookup
    migration: strictly_episodes
    no_stub: true
  field_elimination_mechanism:
  - plugin: skip_on_empty
    method: process
    source: elimination_mechanism
  - plugin: migration_lookup
    migration: strictly_term_elimination_mechanism
    no_stub: true
  field_dance_off_used:
  - plugin: skip_on_empty
    method: process
    source: dance_off_used
  - plugin: static_map
    map:
      'true': 1
      'false': 0
  field_at_risk_group_size:
  - plugin: skip_on_empty
    method: process
    source: at_risk_group_size
  field_vote_direction:
  - plugin: skip_on_empty
    method: process
    source: vote_direction
  field_casting_vote_mode:
  - plugin: skip_on_empty
    method: process
    source: casting_vote_mode
  field_rank_tie_policy:
  - plugin: skip_on_empty
    method: process
    source: rank_tie_policy
  field_combined_tie_break:
  - plugin: skip_on_empty
    method: process
    source: combined_tie_break
  field_showdance_scored:
  - plugin: skip_on_empty
    method: process
    source: showdance_scored
  field_default_scoring_judges:
  - plugin: skip_on_empty
    method: process
    source: default_scoring_judges
  field_default_scale_max:
  - plugin: skip_on_empty
    method: process
    source: default_scale_max
  field_week_has_elimination:
  - plugin: skip_on_empty
    method: process
    source: week_has_elimination
  - plugin: static_map
    map:
      'true': 1
      'false': 0
  field_field_subset:
  - plugin: skip_on_empty
    method: process
    source: field_subset
  field_source_capture:
  - plugin: skip_on_empty
    method: process
    source: source_capture_key
  - plugin: migration_lookup
    migration: strictly_source_captures
    no_stub: true
  field_source_locator: source_locator
  field_source_kind:
  - plugin: skip_on_empty
    method: process
    source: source_kind
  field_note: note
destination:
  plugin: entity:node
  default_bundle: format_rule
migration_dependencies:
  required:
  - strictly_episodes
  - strictly_series
  - strictly_source_captures
  - strictly_term_elimination_mechanism
  - strictly_weeks
  optional: []
