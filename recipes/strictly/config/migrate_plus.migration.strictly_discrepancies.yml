langcode: en
status: true
dependencies: {}
id: strictly_discrepancies
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
- strictly
migration_group: strictly
label: Discrepancys
source:
  plugin: csv
  path: /var/www/html/data/package/discrepancies.csv
  ids:
  - discrepancy_key
  track_changes: true
  constants:
    uid: 1
    status: 1
process:
  title:
  - plugin: concat
    source:
    - table_name
    - natural_key
    - field_name
    delimiter: ' · '
  - plugin: substr
    start: 0
    length: 250
  uid: constants/uid
  status: constants/status
  field_key: discrepancy_key
  field_table_name: table_name
  field_natural_key: natural_key
  field_field_name: field_name
  field_value_a: value_a
  field_source_capture_a:
  - plugin: skip_on_empty
    method: process
    source: source_capture_a_key
  - plugin: migration_lookup
    migration: strictly_source_captures
    no_stub: true
  field_locator_a: locator_a
  field_value_b: value_b
  field_value_b_origin:
  - plugin: skip_on_empty
    method: process
    source: value_b_origin
  field_source_capture_b:
  - plugin: skip_on_empty
    method: process
    source: source_capture_b_key
  - plugin: migration_lookup
    migration: strictly_source_captures
    no_stub: true
  field_locator_b: locator_b
  field_resolution:
  - plugin: skip_on_empty
    method: process
    source: resolution
  field_note: note
destination:
  plugin: entity:node
  default_bundle: discrepancy
migration_dependencies:
  required:
  - strictly_source_captures
  optional: []
