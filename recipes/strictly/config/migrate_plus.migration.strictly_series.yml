langcode: en
status: true
dependencies: {}
id: strictly_series
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
- strictly
migration_group: strictly
label: Seriess
source:
  plugin: csv
  path: /var/www/html/data/package/series.csv
  ids:
  - series_key
  track_changes: true
  constants:
    uid: 1
    status: 1
process:
  title:
  - plugin: concat
    source:
    - label
    delimiter: ' · '
  - plugin: substr
    start: 0
    length: 250
  uid: constants/uid
  status: constants/status
  field_key: series_key
  field_series_kind:
  - plugin: skip_on_empty
    method: process
    source: series_kind
  field_series_number:
  - plugin: skip_on_empty
    method: process
    source: series_number
  field_parent_series:
  - plugin: skip_on_empty
    method: process
    source: parent_series_key
  - plugin: migration_lookup
    migration: strictly_series
    no_stub: true
  field_label: label
  field_wiki_title: wiki_title
  field_year_start:
  - plugin: skip_on_empty
    method: process
    source: year_start
  field_launch_date:
  - plugin: skip_on_empty
    method: process
    source: launch_date
  field_first_live_date:
  - plugin: skip_on_empty
    method: process
    source: first_live_date
  field_final_date:
  - plugin: skip_on_empty
    method: process
    source: final_date
  field_infobox_first_aired:
  - plugin: skip_on_empty
    method: process
    source: infobox_first_aired
  field_infobox_last_aired:
  - plugin: skip_on_empty
    method: process
    source: infobox_last_aired
  field_infobox_num_episodes:
  - plugin: skip_on_empty
    method: process
    source: infobox_num_episodes
  field_home_venue:
  - plugin: skip_on_empty
    method: process
    source: home_venue_key
  - plugin: migration_lookup
    migration: strictly_term_venue
    no_stub: true
  field_series_status:
  - plugin: skip_on_empty
    method: process
    source: status
  field_couples_count_stated:
  - plugin: skip_on_empty
    method: process
    source: couples_count_stated
  field_weeks_count_stated:
  - plugin: skip_on_empty
    method: process
    source: weeks_count_stated
  field_source_capture:
  - plugin: skip_on_empty
    method: process
    source: source_capture_key
  - plugin: migration_lookup
    migration: strictly_source_captures
    no_stub: true
  field_source_locator: source_locator
  field_source_kind:
  - plugin: skip_on_empty
    method: process
    source: source_kind
  field_note: note
destination:
  plugin: entity:node
  default_bundle: series
migration_dependencies:
  required:
  - strictly_source_captures
  - strictly_term_venue
  optional: []
