langcode: en
status: true
dependencies: {}
id: strictly_couple_weeks
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
- strictly
migration_group: strictly
label: Couple weeks
source:
  plugin: csv
  path: /var/www/html/data/package/couple_weeks.csv
  ids:
  - couple_week_key
  track_changes: true
  constants:
    uid: 1
    status: 1
process:
  title:
  - plugin: concat
    source:
    - couple_week_key
    - participation_status
    - result_status
    delimiter: ' · '
  - plugin: substr
    start: 0
    length: 250
  uid: constants/uid
  status: constants/status
  field_key: couple_week_key
  field_couple:
  - plugin: skip_on_empty
    method: process
    source: couple_key
  - plugin: migration_lookup
    migration: strictly_couples
    no_stub: true
  field_week:
  - plugin: skip_on_empty
    method: process
    source: week_key
  - plugin: migration_lookup
    migration: strictly_weeks
    no_stub: true
  field_series:
  - plugin: skip_on_empty
    method: process
    source: series_key
  - plugin: migration_lookup
    migration: strictly_series
    no_stub: true
  field_series_number:
  - plugin: skip_on_empty
    method: process
    source: series_number
  field_week_number:
  - plugin: skip_on_empty
    method: process
    source: week_number
  field_round_stage:
  - plugin: skip_on_empty
    method: process
    source: round_stage
  field_participation_status:
  - plugin: skip_on_empty
    method: process
    source: participation_status
  - plugin: migration_lookup
    migration: strictly_term_participation_status
    no_stub: true
  field_result_status:
  - plugin: skip_on_empty
    method: process
    source: result_status
  - plugin: migration_lookup
    migration: strictly_term_result_status
    no_stub: true
  field_results_round:
  - plugin: skip_on_empty
    method: process
    source: results_round_key
  - plugin: migration_lookup
    migration: strictly_results_rounds
    no_stub: true
  field_at_risk:
  - plugin: skip_on_empty
    method: process
    source: at_risk
  - plugin: static_map
    map:
      'true': 1
      'false': 0
  field_danced_off:
  - plugin: skip_on_empty
    method: process
    source: danced_off
  - plugin: static_map
    map:
      'true': 1
      'false': 0
  field_bye_granted:
  - plugin: skip_on_empty
    method: process
    source: bye_granted
  - plugin: static_map
    map:
      'true': 1
      'false': 0
  field_absence_reason:
  - plugin: skip_on_empty
    method: process
    source: absence_reason
  - plugin: migration_lookup
    migration: strictly_term_absence_reason
    no_stub: true
  field_affected_party:
  - plugin: skip_on_empty
    method: process
    source: affected_party
  field_absence_scope:
  - plugin: skip_on_empty
    method: process
    source: absence_scope
  field_status_raw: status_raw
  field_d_pro:
  - plugin: skip_on_empty
    method: process
    source: d_pro_slug
  - plugin: migration_lookup
    migration: strictly_people
    no_stub: true
  field_d_partnership_kind:
  - plugin: skip_on_empty
    method: process
    source: d_partnership_kind
  field_d_week_total:
  - plugin: skip_on_empty
    method: process
    source: d_week_total
  field_d_is_highest_of_week:
  - plugin: skip_on_empty
    method: process
    source: d_is_highest_of_week
  - plugin: static_map
    map:
      'true': 1
      'false': 0
  field_d_is_lowest_of_week:
  - plugin: skip_on_empty
    method: process
    source: d_is_lowest_of_week
  - plugin: static_map
    map:
      'true': 1
      'false': 0
  field_source_capture:
  - plugin: skip_on_empty
    method: process
    source: source_capture_key
  - plugin: migration_lookup
    migration: strictly_source_captures
    no_stub: true
  field_source_locator: source_locator
  field_source_kind:
  - plugin: skip_on_empty
    method: process
    source: source_kind
  field_note: note
destination:
  plugin: entity:node
  default_bundle: couple_week
migration_dependencies:
  required:
  - strictly_couples
  - strictly_people
  - strictly_results_rounds
  - strictly_series
  - strictly_source_captures
  - strictly_term_absence_reason
  - strictly_term_participation_status
  - strictly_term_result_status
  - strictly_weeks
  optional: []
