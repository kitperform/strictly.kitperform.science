langcode: en
status: true
dependencies: {}
id: strictly_series_people
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
- strictly
migration_group: strictly
label: Series persons
source:
  plugin: csv
  path: /var/www/html/data/package/series_people.csv
  ids:
  - series_person_key
  track_changes: true
  constants:
    uid: 1
    status: 1
process:
  title:
  - plugin: concat
    source:
    - series_key
    - role
    - display_name_in_series
    - roster_status
    delimiter: ' · '
  - plugin: substr
    start: 0
    length: 250
  uid: constants/uid
  status: constants/status
  field_key: series_person_key
  field_series:
  - plugin: skip_on_empty
    method: process
    source: series_key
  - plugin: migration_lookup
    migration: strictly_series
    no_stub: true
  field_person:
  - plugin: skip_on_empty
    method: process
    source: person_key
  - plugin: migration_lookup
    migration: strictly_people
    no_stub: true
  field_role:
  - plugin: skip_on_empty
    method: process
    source: role
  field_roster_status:
  - plugin: skip_on_empty
    method: process
    source: roster_status
  - plugin: migration_lookup
    migration: strictly_term_roster_status
    no_stub: true
  field_display_name_in_series: display_name_in_series
  field_is_head_judge:
  - plugin: skip_on_empty
    method: process
    source: is_head_judge
  - plugin: static_map
    map:
      'true': 1
      'false': 0
  field_replaces:
  - plugin: skip_on_empty
    method: process
    source: replaces_person_key
  - plugin: migration_lookup
    migration: strictly_people
    no_stub: true
  field_replaced_by:
  - plugin: skip_on_empty
    method: process
    source: replaced_by_person_key
  - plugin: migration_lookup
    migration: strictly_people
    no_stub: true
  field_paired_with:
  - plugin: skip_on_empty
    method: process
    source: paired_with_person_key
  - plugin: migration_lookup
    migration: strictly_people
    no_stub: true
  field_reason:
  - plugin: skip_on_empty
    method: process
    source: reason
  - plugin: migration_lookup
    migration: strictly_term_absence_reason
    no_stub: true
  field_reason_text: reason_text
  field_event_date:
  - plugin: skip_on_empty
    method: process
    source: event_date
  field_first_week:
  - plugin: skip_on_empty
    method: process
    source: first_week_key
  - plugin: migration_lookup
    migration: strictly_weeks
    no_stub: true
  field_last_week:
  - plugin: skip_on_empty
    method: process
    source: last_week_key
  - plugin: migration_lookup
    migration: strictly_weeks
    no_stub: true
  field_source_capture:
  - plugin: skip_on_empty
    method: process
    source: source_capture_key
  - plugin: migration_lookup
    migration: strictly_source_captures
    no_stub: true
  field_source_locator: source_locator
  field_source_kind:
  - plugin: skip_on_empty
    method: process
    source: source_kind
  field_note: note
destination:
  plugin: entity:node
  default_bundle: series_person
migration_dependencies:
  required:
  - strictly_people
  - strictly_series
  - strictly_source_captures
  - strictly_term_absence_reason
  - strictly_term_roster_status
  - strictly_weeks
  optional: []
