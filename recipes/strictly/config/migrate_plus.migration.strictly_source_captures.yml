langcode: en
status: true
dependencies: {}
id: strictly_source_captures
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
- strictly
migration_group: strictly
label: Source captures
source:
  plugin: csv
  path: /var/www/html/data/package/source_captures.csv
  ids:
  - source_capture_key
  track_changes: true
  constants:
    uid: 1
    status: 1
process:
  title:
  - plugin: concat
    source:
    - source_capture_key
    delimiter: ' · '
  - plugin: substr
    start: 0
    length: 250
  uid: constants/uid
  status: constants/status
  field_key: source_capture_key
  field_wiki_title: wiki_title
  field_page_id:
  - plugin: skip_on_empty
    method: process
    source: page_id
  field_revid:
  - plugin: skip_on_empty
    method: process
    source: revid
  field_parent_revid:
  - plugin: skip_on_empty
    method: process
    source: parent_revid
  field_rev_timestamp:
  - plugin: skip_on_empty
    method: process
    source: rev_timestamp
  - plugin: format_date
    from_format: Y-m-d\TH:i:s\Z
    to_format: Y-m-d\TH:i:s
    from_timezone: UTC
    to_timezone: UTC
  field_captured_at:
  - plugin: skip_on_empty
    method: process
    source: captured_at
  - plugin: format_date
    from_format: Y-m-d\TH:i:s\Z
    to_format: Y-m-d\TH:i:s
    from_timezone: UTC
    to_timezone: UTC
  field_sha1: sha1
  field_format: format
  field_file_path: file_path
  field_parser_version: parser_version
  field_is_current:
  - plugin: skip_on_empty
    method: process
    source: is_current
  - plugin: static_map
    map:
      'true': 1
      'false': 0
  field_licence_note: licence_note
destination:
  plugin: entity:node
  default_bundle: source_capture
migration_dependencies:
  required: []
  optional: []
