langcode: en
status: true
dependencies: {}
id: strictly_person_aliases
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
- strictly
migration_group: strictly
label: Person aliass
source:
  plugin: csv
  path: /var/www/html/data/package/person_aliases.csv
  ids:
  - person_alias_key
  track_changes: true
  constants:
    uid: 1
    status: 1
process:
  title:
  - plugin: concat
    source:
    - alias
    - person_key
    delimiter: ' · '
  - plugin: substr
    start: 0
    length: 250
  uid: constants/uid
  status: constants/status
  field_key: person_alias_key
  field_person:
  - plugin: skip_on_empty
    method: process
    source: person_key
  - plugin: migration_lookup
    migration: strictly_people
    no_stub: true
  field_alias: alias
  field_alias_kind:
  - plugin: skip_on_empty
    method: process
    source: alias_kind
  field_person_alias_context:
  - plugin: skip_on_empty
    method: process
    source: context
  field_series:
  - plugin: skip_on_empty
    method: process
    source: series_key
  - plugin: migration_lookup
    migration: strictly_series
    no_stub: true
  field_source_capture:
  - plugin: skip_on_empty
    method: process
    source: source_capture_key
  - plugin: migration_lookup
    migration: strictly_source_captures
    no_stub: true
  field_source_locator: source_locator
  field_source_kind:
  - plugin: skip_on_empty
    method: process
    source: source_kind
  field_note: note
destination:
  plugin: entity:node
  default_bundle: person_alias
migration_dependencies:
  required:
  - strictly_people
  - strictly_series
  - strictly_source_captures
  optional: []
