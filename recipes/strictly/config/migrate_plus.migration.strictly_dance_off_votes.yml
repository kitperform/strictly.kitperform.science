langcode: en
status: true
dependencies: {}
id: strictly_dance_off_votes
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
- strictly
migration_group: strictly
label: Dance-off votes
source:
  plugin: csv
  path: /var/www/html/data/package/dance_off_votes.csv
  ids:
  - dance_off_vote_key
  track_changes: true
  constants:
    uid: 1
    status: 1
process:
  title:
  - plugin: concat
    source:
    - results_round_key
    - judge_label_raw
    - couple_key
    delimiter: ' · '
  - plugin: substr
    start: 0
    length: 250
  uid: constants/uid
  status: constants/status
  field_key: dance_off_vote_key
  field_results_round:
  - plugin: skip_on_empty
    method: process
    source: results_round_key
  - plugin: migration_lookup
    migration: strictly_results_rounds
    no_stub: true
  field_series:
  - plugin: skip_on_empty
    method: process
    source: series_key
  - plugin: migration_lookup
    migration: strictly_series
    no_stub: true
  field_week:
  - plugin: skip_on_empty
    method: process
    source: week_key
  - plugin: migration_lookup
    migration: strictly_weeks
    no_stub: true
  field_judge:
  - plugin: skip_on_empty
    method: process
    source: judge_slug
  - plugin: migration_lookup
    migration: strictly_people
    no_stub: true
  field_judge_label_raw: judge_label_raw
  field_couple:
  - plugin: skip_on_empty
    method: process
    source: couple_key
  - plugin: migration_lookup
    migration: strictly_couples
    no_stub: true
  field_vote_kind:
  - plugin: skip_on_empty
    method: process
    source: vote_kind
  field_is_casting_vote_stated:
  - plugin: skip_on_empty
    method: process
    source: is_casting_vote_stated
  - plugin: static_map
    map:
      'true': 1
      'false': 0
  field_list_position:
  - plugin: skip_on_empty
    method: process
    source: list_position
  field_raw_text: raw_text
  field_vote_direction:
  - plugin: skip_on_empty
    method: process
    source: vote_direction
  field_casting_vote_judge:
  - plugin: skip_on_empty
    method: process
    source: casting_vote_slug
  - plugin: migration_lookup
    migration: strictly_people
    no_stub: true
  field_d_is_casting_judge:
  - plugin: skip_on_empty
    method: process
    source: d_is_casting_judge
  - plugin: static_map
    map:
      'true': 1
      'false': 0
  field_source_capture:
  - plugin: skip_on_empty
    method: process
    source: source_capture_key
  - plugin: migration_lookup
    migration: strictly_source_captures
    no_stub: true
  field_source_locator: source_locator
  field_source_kind:
  - plugin: skip_on_empty
    method: process
    source: source_kind
  field_note: note
destination:
  plugin: entity:node
  default_bundle: dance_off_vote
migration_dependencies:
  required:
  - strictly_couples
  - strictly_people
  - strictly_results_rounds
  - strictly_series
  - strictly_source_captures
  - strictly_weeks
  optional: []
