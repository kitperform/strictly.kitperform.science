langcode: en
status: true
dependencies: {}
id: strictly_performances
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
- strictly
migration_group: strictly
label: Performances
source:
  plugin: csv
  path: /var/www/html/data/package/performances.csv
  ids:
  - performance_key
  track_changes: true
  constants:
    uid: 1
    status: 1
process:
  title:
  - plugin: concat
    source:
    - week_key
    - chart_label
    - dance_raw
    delimiter: ' · '
  - plugin: substr
    start: 0
    length: 250
  uid: constants/uid
  status: constants/status
  field_key: performance_key
  field_episode:
  - plugin: skip_on_empty
    method: process
    source: episode_key
  - plugin: migration_lookup
    migration: strictly_episodes
    no_stub: true
  field_week:
  - plugin: skip_on_empty
    method: process
    source: week_key
  - plugin: migration_lookup
    migration: strictly_weeks
    no_stub: true
  field_series:
  - plugin: skip_on_empty
    method: process
    source: series_key
  - plugin: migration_lookup
    migration: strictly_series
    no_stub: true
  field_series_number:
  - plugin: skip_on_empty
    method: process
    source: series_number
  field_week_number:
  - plugin: skip_on_empty
    method: process
    source: week_number
  field_round_stage:
  - plugin: skip_on_empty
    method: process
    source: round_stage
  field_air_date:
  - plugin: skip_on_empty
    method: process
    source: air_date
  field_sequence_in_week:
  - plugin: skip_on_empty
    method: process
    source: sequence_in_week
  field_performer_group:
  - plugin: skip_on_empty
    method: process
    source: performer_group
  field_couple:
  - plugin: skip_on_empty
    method: process
    source: couple_key
  - plugin: migration_lookup
    migration: strictly_couples
    no_stub: true
  field_chart_label: chart_label
  field_performing_pro:
  - plugin: skip_on_empty
    method: process
    source: performing_pro_slug
  - plugin: migration_lookup
    migration: strictly_people
    no_stub: true
  field_couple_label_raw: couple_label_raw
  field_sequence_in_episode:
  - plugin: skip_on_empty
    method: process
    source: sequence_in_episode
  field_running_order:
  - plugin: skip_on_empty
    method: process
    source: running_order
  field_d_perf_seq:
  - plugin: skip_on_empty
    method: process
    source: d_perf_seq
  field_group_key: group_key
  field_performance_kind:
  - plugin: skip_on_empty
    method: process
    source: performance_kind
  - plugin: migration_lookup
    migration: strictly_term_performance_kind
    no_stub: true
  field_selection_role:
  - plugin: skip_on_empty
    method: process
    source: selection_role
  - plugin: migration_lookup
    migration: strictly_term_selection_role
    no_stub: true
  field_performance_status:
  - plugin: skip_on_empty
    method: process
    source: performance_status
  field_scoring_mode:
  - plugin: skip_on_empty
    method: process
    source: scoring_mode
  field_stated_total:
  - plugin: skip_on_empty
    method: process
    source: stated_total
  field_n_marks_stated:
  - plugin: skip_on_empty
    method: process
    source: n_marks_stated
  field_score_cell_raw: score_cell_raw
  field_points_value:
  - plugin: skip_on_empty
    method: process
    source: points_value
  field_dance:
  - plugin: skip_on_empty
    method: process
    source: dance_key
  - plugin: migration_lookup
    migration: strictly_term_dance
    no_stub: true
  field_dance_secondary:
  - plugin: skip_on_empty
    method: process
    source: dance_secondary_key
  - plugin: migration_lookup
    migration: strictly_term_dance
    no_stub: true
  field_dance_raw: dance_raw
  field_theme_column_label: theme_column_label
  field_theme_reference_text: theme_reference_text
  field_theme_ref_wiki_title: theme_reference_wiki_title
  field_music_raw: music_raw
  field_d_total:
  - plugin: skip_on_empty
    method: process
    source: d_total
  field_d_n_marks:
  - plugin: skip_on_empty
    method: process
    source: d_n_marks
  field_d_total_mismatch:
  - plugin: skip_on_empty
    method: process
    source: d_total_mismatch
  - plugin: static_map
    map:
      'true': 1
      'false': 0
  field_d_scale_max:
  - plugin: skip_on_empty
    method: process
    source: d_scale_max
  field_d_total_40:
  - plugin: skip_on_empty
    method: process
    source: d_total_40
  field_d_is_highest_of_week:
  - plugin: skip_on_empty
    method: process
    source: d_is_highest_of_week
  - plugin: static_map
    map:
      'true': 1
      'false': 0
  field_d_is_lowest_of_week:
  - plugin: skip_on_empty
    method: process
    source: d_is_lowest_of_week
  - plugin: static_map
    map:
      'true': 1
      'false': 0
  field_d_results_round:
  - plugin: skip_on_empty
    method: process
    source: d_results_round_key
  - plugin: migration_lookup
    migration: strictly_results_rounds
    no_stub: true
  field_d_partnership_kind:
  - plugin: skip_on_empty
    method: process
    source: d_partnership_kind
  field_source_capture:
  - plugin: skip_on_empty
    method: process
    source: source_capture_key
  - plugin: migration_lookup
    migration: strictly_source_captures
    no_stub: true
  field_source_locator: source_locator
  field_source_kind:
  - plugin: skip_on_empty
    method: process
    source: source_kind
  field_note: note
destination:
  plugin: entity:node
  default_bundle: performance
migration_dependencies:
  required:
  - strictly_couples
  - strictly_episodes
  - strictly_people
  - strictly_results_rounds
  - strictly_series
  - strictly_source_captures
  - strictly_term_dance
  - strictly_term_performance_kind
  - strictly_term_selection_role
  - strictly_weeks
  optional: []
