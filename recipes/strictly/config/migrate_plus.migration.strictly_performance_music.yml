langcode: en
status: true
dependencies: {}
id: strictly_performance_music
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
- strictly
migration_group: strictly
label: Performance musics
source:
  plugin: csv
  path: /var/www/html/data/package/performance_music.csv
  ids:
  - performance_music_key
  track_changes: true
  constants:
    uid: 1
    status: 1
process:
  title:
  - plugin: concat
    source:
    - performance_key
    - seq
    delimiter: ' · '
  - plugin: substr
    start: 0
    length: 250
  uid: constants/uid
  status: constants/status
  field_key: performance_music_key
  field_performance:
  - plugin: skip_on_empty
    method: process
    source: performance_key
  - plugin: migration_lookup
    migration: strictly_performances
    no_stub: true
  field_seq:
  - plugin: skip_on_empty
    method: process
    source: seq
  field_song:
  - plugin: skip_on_empty
    method: process
    source: song_key
  - plugin: migration_lookup
    migration: strictly_songs
    no_stub: true
  field_artist:
  - plugin: skip_on_empty
    method: process
    source: artist_key
  - plugin: migration_lookup
    migration: strictly_term_artist
    no_stub: true
  field_source_work_text: source_work_text
  field_source_work_wiki_title: source_work_wiki_title
  field_raw_text: raw_text
  field_source_capture:
  - plugin: skip_on_empty
    method: process
    source: source_capture_key
  - plugin: migration_lookup
    migration: strictly_source_captures
    no_stub: true
  field_source_locator: source_locator
  field_source_kind:
  - plugin: skip_on_empty
    method: process
    source: source_kind
  field_note: note
destination:
  plugin: entity:node
  default_bundle: performance_music
migration_dependencies:
  required:
  - strictly_performances
  - strictly_songs
  - strictly_source_captures
  - strictly_term_artist
  optional: []
